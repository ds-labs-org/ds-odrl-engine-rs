# Its own workspace root on purpose.
#
# This crate lives inside the repository tree but deliberately does NOT
# join the root workspace: adding it to `[workspace] members` would put a
# bench-only binary (and `wasmi`, and a second copy of the engine's
# dependency graph) into `cargo test --workspace`, `cargo clippy
# --workspace --all-targets` and every CI gate this repo already runs.
# An empty `[workspace]` table makes cargo treat this directory as its own
# workspace root, so the root `Cargo.toml` stays byte-for-byte untouched.
[workspace]

[package]
name = "perf-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Performance / resource / load instrumentation for ds-odrl-engine-rs, over the same 68-fixture corpus compliance-runner scores"
publish = false

[dependencies]
# The native invocation path (a): the exact entry point
# `compliance-runner/src/main.rs` calls per fixture.
engine = { path = "../../../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The wasm invocation path (b). Same version the root workspace pins for
# `release-history`, whose `src/host.rs` this crate's `host.rs` is a
# fuel-toggleable copy of.
wasmi = "2"

[profile.release]
# Match what `cargo run -p compliance-runner --release` and
# `scripts/build-release-history.sh` get from the root workspace: plain
# stable release defaults, no bench-only tuning (no LTO, no
# codegen-units=1). Measuring a profile nothing else in this repo ever
# builds would produce numbers no other run here can be compared against.
debug = false

    <title>ds-odrl-engine-rs</title>

    <!-- GitHub Pages SPA redirect, part 2 of 2 -- see site/404.html for
         part 1 and the rafgraham/spa-github-pages mechanics this
         implements in full. If a direct hit or reload on a client-side
         route 404'd and got redirected here by that file's encoded query
         string (e.g. "?/coverage&a=b"), this script runs before anything
         else on the page -- including before Trunk's own bootstrap
         script fetches and instantiates the Yew app's wasm module, which
         is emitted later in this document -- and rewrites the URL back
         to the real path ("/coverage?a=b") using `history.replaceState`,
         which rewrites browser history without triggering a navigation.
         `yew_nested_router`'s `Router<AppRoute>` (see src/app_route.rs,
         src/main.rs) only reads `window.location` once it mounts, well
         after this script has already run, so the app boots straight
         into the intended route instead of flashing Home first. A no-op
         on every ordinary load, including a normal in-app client-side
         navigation: the `if` only matches the "?/" marker 404.html
         writes, never a real query string a user, bookmark, or link
         would produce. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- data-trunk-public-url stamps this <base href> from Trunk's own
         --public-url at build time (e.g. "/ds-odrl-engine-rs/" for the
         GitHub Pages deploy, "/" for a local `trunk serve`). Every
         relative URL on this page -- including the runtime `fetch()` of
         engine.wasm in src/engine_module.rs, which asks for the plain
         relative path "engine.wasm" -- resolves against this <base>
         rather than the document's own request path, so the site works
         unmodified whether it's served at the root or under a GitHub
         Pages project subpath. See site/Trunk.toml's pre_build hook
         comment for how engine.wasm itself gets into dist/. -->
    <base data-trunk-public-url />

    <link data-trunk rel="sass" href="target/node_modules/@patternfly/patternfly/6.4.0/patternfly.scss">
    <link data-trunk rel="sass" href="target/node_modules/@patternfly/patternfly/6.4.0/patternfly-addons.scss">
    <link data-trunk rel="copy-dir" href="target/node_modules/@patternfly/patternfly/6.4.0/assets" data-target-path="assets/">

    <link data-trunk rel="copy-dir" href="target/node_modules/@fortawesome/fontawesome-free/7.1.0/webfonts">

    <!-- This site's own theme: re-points a handful of PatternFly design

    <link data-trunk rel="css" href="assets/theme.css">

    <!-- The compiled engine module, rebuilt fresh by Trunk.toml's own
         pre_build hook every time this site builds -- see that file's
         header comment for why a hook (not a plain Cargo dependency) is
         required. Lands at dist/engine.wasm, fetched at runtime via a
         path relative to this page's own <base href> above. -->
    <link data-trunk rel="copy-file" href="assets/engine.wasm" />

    <!-- The *native* compliance-runner run's own recorded verdicts. The
         Compliance Results page (src/compliance_page.rs) no longer renders
         this file: it re-runs the whole corpus against engine.wasm in the
         visitor's browser (see the next copy-file directive) and fetches
         this one only as the baseline to cross-check that live run
         against, per case. Still fetched at runtime rather than read at
         this site's own Rust compile time (unlike the Home page's
         compile-time-embedded summary, see src/pages.rs), so redeploying
         after a future compliance-runner run picks up new numbers with no
         Rust code change -- just re-copying this file and rebuilding. href
         is relative to this file's own directory (site/), one level up
         into the sibling compliance/ crate's generated report;
         data-target-path lands it at dist/compliance-data/latest.json.

         Deliberately NOT "compliance" (this app's own `/compliance`
         route, see src/app_route.rs): Trunk's copy-file would then create
         a *physical* dist/compliance/ directory holding only
         latest.json, no index.html, and a real static file server (both
         `trunk serve` and GitHub Pages) treats a bare request for
         "/compliance" that happens to also be a directory name as a
         redirect-to-"/compliance/" first -- which has no index.html to
         fall back to, so the SPA route 404s instead of reaching
         switch_app_route.rs. Confirmed empirically under `trunk serve`
         (307 to /compliance/, then the client router silently re-resolved
         to Home) while verifying this site end-to-end; renaming the
         asset's own directory sidesteps the collision entirely rather
         than fighting server-side rewrite rules. -->
    <link data-trunk rel="copy-file" href="../compliance/reports/latest.json" data-target-path="compliance-data" />

    <!-- The live compliance runner's test corpus: every case's exact
         engine::wire::Request plus the vendored suite's own expected
         decision, written by `cargo run -p compliance-runner --release`
         alongside latest.json above (see compliance-runner/src/cases.rs).
         The Compliance Results page fetches this at runtime and
         re-executes all of it against engine.wasm in the visitor's own
         browser, so the numbers that page shows are computed there rather
         than read out of a committed file. Same compliance-data/ target
         directory as latest.json above, for exactly the same /compliance
         route-collision reason documented there.

         Trunk's copy-file fails the build outright if this file is
         missing, which is the right failure mode here: the site must not
         deploy without the corpus its Compliance page executes. -->
    <link data-trunk rel="copy-file" href="../compliance/reports/latest-cases.json" data-target-path="compliance-data" />

    <!-- The ODRL 2.2 Coverage page's probe catalog: 52 documented
         vocabulary claims and the 115 exact Section 5.2 requests that put
         49 of them to the test, written by `cargo run -p coverage-probes
         --release` (see coverage-probes/src/catalog.rs). That page
         fetches this at runtime and executes every probe against
         engine.wasm in the visitor's own browser, then decides per row
         whether what the engine just did agrees with the status this
         study documents -- so a row can come back *contradicted*, which
         is the whole point of it being live rather than rendered.

         Same compliance-data/ target directory as the two artifacts
         above, and for a sharper version of the same reason: this page's
         own route is `/coverage`, so a data directory literally named
         `coverage` would reproduce the /compliance route-vs-directory
         307-redirect collision documented at length above, exactly. That
         this directory is named `compliance-data` rather than
         `compliance` is precisely what makes it safe to reuse for a
         second page's data.

         Trunk's copy-file fails the build outright if this file is
         missing, which is again the right failure mode: the site must not
         deploy a Coverage page with no catalog to execute. -->
    <link data-trunk rel="copy-file" href="../compliance/reports/latest-coverage.json" data-target-path="compliance-data" />

    <!-- The Release History page's data artifact: every tagged release's
         real ODRL-Test-Suite result (as that tag's own compliance-runner
         reported it, re-executed at that tag), plus today's 125-probe
         coverage catalog replayed against that tag's own compiled
         engine.wasm through its C ABI. Written by
         `scripts/build-release-history.sh` followed by `cargo run -p
         release-history --release` -- see the README's "Release history
         dashboard" section for the regeneration procedure and for why it
         is deliberately not part of the ordinary CI loop (it rebuilds
         every historical engine, which is a tag-time job, not a
         per-commit one).

         Unlike the three artifacts above, this one carries *results*
         rather than only inputs -- and that difference is the one thing
         about this page that has to be stated rather than assumed. The
         Compliance and Coverage pages recompute everything they show
         because they can: one engine.wasm, already fetched. This page
         cannot: its subject is nineteen *different* historical
         engine.wasm binaries, and asking a visitor's browser to download
         and instantiate all of them on page load, to recompute figures
         that change only when a tag is cut, is a far worse trade than
         saying plainly that these are build-time numbers. The page says
         exactly that in an Alert above the dashboard, and carries each
         release's engine.wasm SHA-256 so the claim is checkable rather
         than merely asserted.

         Same compliance-data/ target directory as the three above, and
         for the same reason spelled out at length there: this page's own
         route is `/history`, so a data directory named `history` would
         reproduce the /compliance route-vs-directory 307-redirect
         collision exactly.

         Trunk's copy-file fails the build outright if this file is
         missing, which is again the right failure mode: the site must not
         deploy a Release History page with no record to render. -->
    <link data-trunk rel="copy-file" href="../compliance/reports/release-history.json" data-target-path="compliance-data" />

    <!-- This product's own mark: same mesh/node visual language as the
         ds42.org dataspace study this engine implements (see the case
         study link on every page), re-drawn with this product's own

         data-target-path is a target DIRECTORY for copy-file (the source
         basename is preserved), so this lands at dist/brand/logo.svg for
         the masthead brand mark; the plain rel="icon" link below copies
         it again for use as the favicon. -->
    <link data-trunk rel="copy-file" href="assets/logo.svg" data-target-path="brand" />
    <link data-trunk rel="icon" type="image/svg+xml" href="assets/logo.svg" />

    <!-- GitHub Pages' own 404 page for this site, wired into the Trunk

    <link data-trunk rel="copy-file" href="404.html" />

[package]
name = "n3-enforcer"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DRAFT: a reasoner-backed ODRL enforcer that runs SolidLab's N3 rules and reduces the compliance report to the engine's Allow/Deny"
publish = false

[dependencies]
engine = { path = "../engine" }
serde_json = "1"

# In-process Rust N3 reasoner: eyereasoner/eyeron, pinned past the merge of
# our own join-ordering fix (#2), the maintainer's own fix for the
# resource-exhaustion gaps we reported (#18/6ed1a43), and our own #20/#22
# fixes -- per-triple storage overhead (e9e179e, ~262MB->149MB and
# ~0.98s->0.47s at 100,000 facts), the string:matches/notMatches silent-
# wrong-answer regex fallback, and PreparedReasoner re-cloning its static
# rule set and agenda index on every call (which is exactly the bug
# EyeronLib's own rules cache in this crate works around one layer up --
# this pin gets the fix inside eyeron itself too, for anyone going through
# PreparedReasoner directly). Git-only, not on crates.io. The SPARQL 1.2 RL
# front end was dropped upstream at this pin; unused here (only
# parse_n3/reason/PreparedReasoner/Term). Also used to parse any reasoner's
# output (so no oxttl/oxrdf, and with them no getrandom, which
# wasm32-unknown-unknown builds would need configured).
[dependencies.eyeron]
git = "https://github.com/eyereasoner/eyeron"
rev = "6f99b99dbe41239b7521618504d121249c8a82b2"

[dev-dependencies]

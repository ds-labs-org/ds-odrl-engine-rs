[package]
name = "n3-enforcer"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DRAFT: a reasoner-backed ODRL enforcer that runs SolidLab's N3 rules and reduces the compliance report to the engine's Allow/Deny"
publish = false

[features]
default = ["eyeron"]
# In-process Rust N3 reasoner: eyereasoner/eyeron >= 0.6.8, which carries the
# fixes this crate needs (xsd:dateTime comparison, collectAllIn blank
# templates, log:uuid; merged upstream as PR #9). Git-only, not on crates.io.
eyeron = ["dep:eyeron"]

[dependencies]
engine = { path = "../engine" }
oxrdf = "0.3.4"
oxttl = "0.2.4"
serde_json = "1"

[dependencies.eyeron]
git = "https://github.com/eyereasoner/eyeron"
rev = "1c01133ad5e3442aa71e8ef036e629ac74e8c176"
optional = true

[dev-dependencies]

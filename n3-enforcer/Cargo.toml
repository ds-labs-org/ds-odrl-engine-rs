[package]
name = "n3-enforcer"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DRAFT: a reasoner-backed ODRL enforcer that runs SolidLab's N3 rules and reduces the compliance report to the engine's Allow/Deny"
publish = false

[dependencies]
engine = { path = "../engine" }
serde_json = "1"

# In-process Rust N3 reasoner: eyereasoner/eyeron, pinned past the merge of
# our own join-ordering fix (#2), the maintainer's own fix for the
# resource-exhaustion gaps we reported (#18/6ed1a43), and our own #20/#22/#23
# fixes -- per-triple storage overhead, the string:matches/notMatches
# silent-wrong-answer regex fallback, PreparedReasoner re-cloning its
# static rule set and agenda index on every call (the bug EyeronLib's own
# rules cache in this crate works around one layer up -- this pin gets the
# fix inside eyeron itself too), and ReasonerOptions.include_explicit
# skipping the explicit-fact clone eyeron::reason(&str) never reads. Also
# past the maintainer's own follow-up on #20: Term's string payload is now
# Arc<str> (a886f1a/48333e4), so cloning a term no longer copies its text
# -- re-verified this crate's own Term::Iri/Blank pattern matches
# (reduce.rs) still compile and behave the same against that. Git-only,
# not on crates.io. The SPARQL 1.2 RL front end was dropped upstream at
# this pin; unused here (only parse_n3/reason/PreparedReasoner/Term). Also
# used to parse any reasoner's output (so no oxttl/oxrdf, and with them no
# getrandom, which wasm32-unknown-unknown builds would need configured).
[dependencies.eyeron]
git = "https://github.com/eyereasoner/eyeron"
rev = "2eb9dc418c0cfdaef087878dce750529fddcaef6"

[dev-dependencies]

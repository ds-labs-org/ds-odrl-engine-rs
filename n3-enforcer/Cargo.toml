[package]
name = "n3-enforcer"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DRAFT: a reasoner-backed ODRL enforcer that runs SolidLab's N3 rules and reduces the compliance report to the engine's Allow/Deny"
publish = false

[dependencies]
engine = { path = "../engine" }
serde_json = "1"

# In-process Rust N3 reasoner: eyereasoner/eyeron, pinned past the merge of
# our own join-ordering fix (#2) and the maintainer's own fix for the
# resource-exhaustion gaps we reported (#18/6ed1a43) -- xsd:dateTime
# comparison, collectAllIn blank templates and log:uuid were merged earlier
# as PR #9. Git-only, not on crates.io. The SPARQL 1.2 RL front end was
# dropped upstream at this pin; unused here (only parse_n3/reason/Term).
# Also used to parse any reasoner's output (so no oxttl/oxrdf, and with them
# no getrandom, which wasm32-unknown-unknown builds would need configured).
[dependencies.eyeron]
git = "https://github.com/eyereasoner/eyeron"
rev = "55c6db0784029b47dbf5c4ba5c90d82e075c9e61"

[dev-dependencies]

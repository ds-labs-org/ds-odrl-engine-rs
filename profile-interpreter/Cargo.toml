[package]
name = "profile-interpreter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads a real ODRL Profile document (Turtle or JSON-LD) and produces the engine::Profile / config JSON this engine's wire contract expects — an adapter, not a wire-contract or engine change."

[[bin]]
name = "profile-interpreter"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
oxrdf = "0.3.4"
oxttl = "0.2.4"
oxjsonld = "0.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history and tags, not the default shallow single-commit
          # clone: the release-history rebuild below checks out and
          # builds every `git tag`, and its cache key hashes `git tag -l`
          # itself -- both are silently empty on a fetch-depth: 1
          # checkout, which would make that whole step a no-op rather than
          # a build failure. Same reasoning as
          # `.github/workflows/pages.yml`'s identical checkout step.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          # scripts/build-release-history.sh builds every historical tag's
          # engine.wasm for this target.
          targets: wasm32-unknown-unknown

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace

      # dsp-odrl-adapter's whole capability is behind a default-off Cargo
      # feature (its README explains why), which means the run above
      # compiles it as an empty library and executes none of its tests. A
      # default-off feature nothing ever builds rots silently, so it gets
      # its own run rather than being trusted to stay green.
      - name: cargo test (dsp-odrl-adapter opt-in feature)
        run: cargo test --workspace --features dsp-odrl-adapter/dsp-ingest

      # Release History dashboard (compliance/reports/release-history.json),
      # regenerated here for the same reason latest.json/latest-coverage.json
      # are regenerated below: a committed artifact this repo checks in
      # must be what the current source actually produces, and this one is
      # not exempt just because rebuilding it is heavier. Before this,
      # nothing in CI ever regenerated it -- the "compliance reports are up
      # to date" step's own `git diff --exit-code compliance/reports/`
      # already covers this file's *directory*, but a diff can only catch
      # drift in a file something in this job actually re-wrote first, and
      # nothing did, so release-history.json's own staleness (five real
      # tags silently missing for a full release cycle) went uncaught by
      # that same line for months. `.github/workflows/pages.yml` already
      # regenerates it fresh for every deploy; this reuses the identical
      # mechanism -- same staging path, same tag-list-hash cache key, same
      # `restore-keys` prefix fallback -- rather than inventing a second
      # approach, so a `pages.yml` run and this job share one cache
      # namespace and warm each other.
      #
      # **This job's `pull_request` trigger changes what the cache can
      # guarantee, not what this check verifies.** A `pull_request` run,
      # especially from a fork, may be unable to *save* a new cache entry:
      # GitHub Actions withholds cache-write from a forked PR's more
      # limited token, specifically to stop a fork from poisoning the base
      # repo's cache. `actions/cache` already degrades that to a silent
      # no-op save rather than failing the job, so nothing extra is needed
      # here to handle it. Reading is unaffected by the same restriction --
      # `restore-keys` still restores whatever a prior `push`-triggered run
      # (on this job or `pages.yml`) already cached for the base branch, so
      # the common case (a PR that adds no new tag) stays a fast cache hit
      # regardless of who opened the PR. The uncached worst case -- a fork
      # PR with no accessible cache at all -- rebuilds every tag from
      # scratch, which is slow but still correct; slow-but-correct on an
      # infrequent path is the right tradeoff, not a reason to skip this
      # check on PRs.
      - name: compute release-history cache key from the current tag list
        id: release-history-key
        run: echo "tags-hash=$(git tag -l | sort -V | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: restore release-history staging cache
        uses: actions/cache@v4
        with:
          path: target/release-history/stage
          key: release-history-stage-v1-${{ steps.release-history-key.outputs.tags-hash }}
          restore-keys: |
            release-history-stage-v1-

      - name: build any tags missing from the release-history staging cache
        run: scripts/build-release-history.sh

      - name: regenerate compliance/reports/release-history.json
        run: cargo run -p release-history --release

      # The committed artifacts under compliance/reports/ must be what the
      # current source actually produces. latest.json is the native run's
      # recorded baseline; latest-cases.json is the corpus the site
      # re-executes against engine.wasm in a visitor's browser;
      # latest-coverage.json is the ODRL 2.2 vocabulary probe catalog the
      # Coverage page executes the same way; and release-history.json
      # (regenerated by the steps just above) is that same catalog replayed
      # against every historical engine.wasm. A commit that changes
      # translate.rs, the probe catalog, or the shipped action taxonomy
      # without regenerating them would ship a site whose live run
      # disagrees with its own committed data, in front of a visitor, long
      # after this could have caught it. Costs milliseconds on top of a
      # build CI already does, for three of these four files; the fourth
      # is the one this step exists to actually cover now.
      #
      # Note what this check can and cannot catch for the coverage
      # catalog: that artifact records requests and *expectations*, never
      # decisions, so a diff here catches a catalog change but NOT an
      # engine change that alters a decision or a `reason` string. The
      # guard for that is coverage-probes' own
      # `every_probe_expectation_holds_against_the_native_engine` test,
      # run by the `cargo test` step above -- and, for release-history.json
      # specifically,
      # `site::history_catalog::tests::the_newest_release_agrees_with_the_current_catalog`.
      - name: compliance reports are up to date
        run: |
          cargo run -p compliance-runner --release
          cargo run -p coverage-probes --release
          git diff --exit-code compliance/reports/

name: Deploy site to GitHub Pages

# Redeploy whenever something the published site actually reads changes:
# the site crate itself, the engine crate it compiles to wasm and embeds
# via Trunk.toml's pre_build hook (see site/Trunk.toml), the artifacts
# under compliance/reports/ that the Compliance Results and ODRL 2.2
# Coverage pages fetch at runtime (see site/index.html's three copy-file
# directives), or this workflow file. Deliberately NOT
# compliance-runner/**, coverage-probes/**, compliance/vendor/**, or
# profile-interpreter/examples/*.ttl -- every one of those *produces* an
# artifact without *being* one, so a generator-source-only commit that
# hasn't been re-run yet must not trigger a redeploy with stale content.
# The omission is the policy, not an oversight.
#
# `compliance/reports/release-history.json` is the one exception to
# "commit it, then trigger on it": the build job below regenerates it
# from scratch on every run this workflow fires for, rather than reading
# whatever is checked in, so its own staleness can never be a reason a
# push should or shouldn't redeploy -- see the build job's own comment
# ahead of `compute release-history cache key`.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "engine/**"
      - "compliance/reports/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history and tags, not the default shallow single-commit
          # clone: scripts/build-release-history.sh checks out and builds
          # every `git tag`, and the cache key two steps below hashes
          # `git tag -l` itself -- both are silently empty on a
          # fetch-depth: 1 checkout, which would make the Release History
          # rebuild below a silent no-op rather than a build failure.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Release History dashboard (compliance/reports/release-history.json)
      # regenerated fresh for every deploy, rather than trusted from git,
      # so the deployed /history page always covers every tag that exists
      # right now -- including one just cut on this very push -- without a
      # human remembering to run scripts/build-release-history.sh by hand.
      # This is the actual fix for the staleness a manual-only process
      # produced (five real tags went unregenerated for a full compliance
      # cycle before anyone noticed). Deliberately NOT committed back to
      # the repo: a bot commit touching compliance/reports/** would
      # re-trigger this same workflow via its own path filters above, and
      # avoiding that loop entirely is simpler than guarding against it.
      # The repo's own checked-in copy stays a point-in-time snapshot,
      # refreshed by hand alongside a release the way this file's sibling
      # `compliance/reports/*.json` artifacts are checked by `ci.yml`
      # instead of regenerated here -- see README.md's "Regenerating it".
      #
      # The expensive part is stage 1 (scripts/build-release-history.sh):
      # rebuilding every historical `engine.wasm` and re-running each
      # tag's own compliance-runner. It is already incremental on its own
      # terms -- a tag whose staging directory has both artifacts is
      # skipped -- but a fresh GitHub Actions runner starts with no
      # staging directory at all, so without a cache this would rebuild
      # every tag from scratch on every single push to main, which is
      # slow and wasteful for an ordinary docs or site change. Caching
      # `target/release-history/stage`, keyed on a hash of the current tag
      # list with a stable-prefix `restore-keys` fallback, turns "rebuild
      # every tag" into "rebuild only the tags that did not exist last
      # time this ran": a push with no new tags gets an exact cache hit
      # and the script below is a fast no-op; a push with exactly one new
      # tag restores every older tag's cached artifacts via the prefix
      # match and stage 1 builds only that one tag's wasm and compliance
      # run, not the whole history.
      - name: compute release-history cache key from the current tag list
        id: release-history-key
        run: echo "tags-hash=$(git tag -l | sort -V | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: restore release-history staging cache
        uses: actions/cache@v4
        with:
          path: target/release-history/stage
          key: release-history-stage-v1-${{ steps.release-history-key.outputs.tags-hash }}
          restore-keys: |
            release-history-stage-v1-

      - name: build any tags missing from the release-history staging cache
        run: scripts/build-release-history.sh

      - name: regenerate compliance/reports/release-history.json
        run: cargo run -p release-history --release

      # Prebuilt binary from trunk-rs/trunk's own GitHub Releases rather
      # than `cargo install trunk` -- avoids a from-source compile on
      # every run. Pinned to the same 0.22.0-beta.2 this repo's site is
      # developed and verified against (site/Trunk.toml's pre_build hook
      # relies on beta-2-era hook-ordering behavior).
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.0-beta.2

      - name: trunk build --release
        working-directory: site
        run: trunk build --release --public-url /ds-odrl-engine-rs/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

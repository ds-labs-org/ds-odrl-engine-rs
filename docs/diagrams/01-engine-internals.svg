<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 883 763" role="img" aria-label="ds-odrl-engine-rs internals. The engine crate is a pure, stateless (policy, claims) -&gt; decision evaluator with no I/O, no clock and no RDF layer. Hosts call it over a JSON wire contract; adapters turn real documents into that contract; verification harnesses drive it against independent corpora. A static rendering of the honeycomb-vocabulary source next to this file.">
